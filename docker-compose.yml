version: "3.9"

# BuskinaTicket — Local Development Infrastructure
# Démarre PostgreSQL + Redis + Redis Sentinel

services:
  postgres:
    image: postgres:16-alpine
    container_name: buskinaticket_postgres
    environment:
      POSTGRES_USER: buskinaticket
      POSTGRES_PASSWORD: buskinaticket_dev_password
      POSTGRES_DB: buskinaticket_dev
      # Activer les extensions requises
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=fr_FR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buskinaticket -d buskinaticket_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buskinaticket_redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Interface admin Redis (développement uniquement)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: buskinaticket_redis_ui
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools  # Démarrer avec: docker compose --profile tools up

  # pgAdmin (développement uniquement)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: buskinaticket_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@buskinaticket.bf
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
    name: buskinaticket_postgres_data
  redis_data:
    name: buskinaticket_redis_data

networks:
  default:
    name: buskinaticket_network
